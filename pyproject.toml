[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "swmcp"
version = "0.1.0"
description = "Serveur MCP local et déterministe pour piloter SolidWorks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  # FastMCP (spec §4). mcp 2.x a renommé FastMCP en MCPServer : on reste sur la branche 1.x.
  "mcp>=1.30,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.7,<3",
  "pillow>=10.4",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[project.scripts]
swmcp = "swmcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["solidworks: test d'intégration exigeant un vrai SolidWorks (ignoré par défaut)"]
addopts = "-m 'not solidworks' -q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # E501 : le formateur gère la longueur

[tool.ruff.lint.per-file-ignores]
"src/swmcp/cli.py" = ["T20"]
"src/swmcp/doctor.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/swmcp"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["win32com.*", "pythoncom", "pywintypes", "win32api", "win32con", "win32process", "winreg"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["swmcp"]
